# Cirrus 官方 API 操作登记模板（设计材料，不是生产配置）
# 复制后逐项填入维护者提供的真实契约。null 表示未知，不允许在生产静默取默认值。
# operationId 与 normalizedInputExample 是 Cirrus 内部逻辑名，不是官方接口路径／字段。
# 不要填入真实 Cookie、令牌、账号密码、有效签名 URL 或私人数据。

templateVersion: 1
operationId: catalog.trackDetails
status: unmapped # unmapped | mapped | fixture-verified | live-verified | deprecated
owner: null
reviewedAt: null
relatedRequirements:
  - FR-008
provider: netease-official
deliveryModel: built-in-direct # 用户不配置 endpoint；不依赖第三方 API 服务
contractRevision: null
sourceReference: null # 官方资料版本／内部文档引用，不含凭据

endpoint:
  httpsOrigin: null
  method: null
  path: null
  protocolVariant: null
  contentType: null
  redirectPolicy: reviewed-hosts-only
  allowedRedirectHosts: [] # 必须来自实际契约，不允许通配任意域

request:
  officialFields: [] # name/type/required/range/encoding/default/sensitive
  fieldMapping: [] # 领域字段到官方字段的逐项转换
  serializationRules: null
  maxBatchSize: null
  requiredHeaders: [] # 只登记名称与生成策略，不登记秘密值
  authentication:
    mode: null # guest/session/conditional 等，以真实契约为准
    cookiePolicy: null
    csrfPolicy: null
    deviceIdentityPolicy: null
  signing:
    required: null
    algorithmReference: null
    canonicalization: null
    encoding: null
    noncePolicy: null
    clockSkewPolicy: null
    goldenVectorReferences: []
  normalizedInputExample:
    trackIds:
      - "9007199254740993" # 合成的大整数边界样例，仅内部输入示意

response:
  officialEnvelope: null
  successPredicate: null # HTTP 状态 + 业务状态，不默认 code=某个猜测值
  requiredFields: []
  optionalFields: []
  domainMapping: []
  nullAndUnknownRules: null
  idPrecisionRules: decimal-string-at-boundary
  timeUnitMapping: null
  pagination:
    kind: null # none/offset/cursor/其他真实约定
    maxPageSize: null
    totalSemantics: null
    orderingGuarantee: null
  authorizationMapping: null
  errorMappings: [] # providerCode -> AppError；未登记值不能自动成功
  partialSuccessSemantics: null

execution:
  cancellation: required
  sessionEpochCheck: required
  idempotency: unverified
  serverIdempotencyKey: null
  automaticRetryAllowed: false # 契约审查后才允许修改
  retryableConditions: []
  rateLimit: null
  inactivityTimeoutMs: 8000 # 初始客户端预算，不是官方 SLA
  attemptDeadlineMs: 15000
  actionDeadlineMs: 30000
  maximumResponseBytes: 8388608

cache:
  enabled: false # 完成权限／内容范围审查后才能开启
  scope: unverified # public/profile/session
  ttlSeconds: null
  invalidationTriggers: []
  persistRawResponse: false

security:
  secretValuesInLogs: forbidden
  persistentMediaUrls: forbidden
  responseContentClassification: null
  requiredRedactions: []
  minimumUserPermissions: null

verification:
  fixtures:
    success: null
    empty: null
    authExpired: null
    accessDenied: null
    rateLimited: null
    malformed: null
    partialFailure: null
  mapperTests: []
  signerTests: []
  cancellationAndRaceTests: []
  liveVerification:
    performed: false
    date: null
    adapterRevision: null
    evidenceReference: null # 仅脱敏报告路径
    accountClass: null # 如 guest/普通/不同权益，不存账号秘密
  unresolvedQuestions: []
