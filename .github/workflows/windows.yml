# Windows build, called by CI (build only) and the release workflow (installer and zip).
# docs/tasks/release.md §5. MSVC, Qt from the Qt installer, FFmpeg/OpenSSL/zlib from
# vcpkg (packaging/windows/vcpkg.json), QtKeychain from packaging/deps/.
name: Windows

on:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false

permissions:
  contents: read

env:
  QT_VERSION: 6.11.2
  QT_MODULES: qtmultimedia qtshadertools qtimageformats

jobs:
  windows:
    name: Windows build
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          # Qt 6.11+ on Windows moved to one repository folder per arch; aqtinstall 3.3.0 (the
          # latest release) cannot find it. Master has the fix (miurahr/aqtinstall#1000); go back
          # to the default once a release after 3.3.0 ships.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7

      - name: Paths
        run: |
          temp=$(cygpath -m "$RUNNER_TEMP")
          {
            echo "QT=$(cygpath -m "$QT_ROOT_DIR")"
            echo "DEPS=$temp/deps"
            echo "VCPKG_ROOT=$temp/vcpkg"
            echo "VCPKG_INSTALLED=$temp/vcpkg_installed"
            echo "VCPKG_DEFAULT_BINARY_CACHE=$temp/vcpkg-cache"
            echo "STAGE=$temp/Cirrus"
            echo "VERSION=$(sed -nE 's/^project\(CirrusMusic VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          } >> "$GITHUB_ENV"

      - name: Tools
        run: choco install ninja ${{ inputs.package && 'innosetup' || '' }} -y --no-progress

      - name: Cache vcpkg packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ hashFiles('packaging/windows/vcpkg.json') }}
          restore-keys: vcpkg-

      - name: FFmpeg, OpenSSL, zlib (vcpkg)
        run: |
          baseline=$(sed -nE 's/.*"builtin-baseline": "([0-9a-f]+)".*/\1/p' packaging/windows/vcpkg.json)
          git clone --quiet https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout --quiet "$baseline"
          "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/vcpkg.exe" install --triplet x64-windows \
            --x-manifest-root=packaging/windows --x-install-root="$VCPKG_INSTALLED"

      - name: Cache QtKeychain
        id: deps
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/deps
          key: deps-windows-${{ env.QT_VERSION }}-${{ hashFiles('packaging/deps/*.sh') }}

      - name: QtKeychain
        if: steps.deps.outputs.cache-hit != 'true'
        run: packaging/deps/build-qtkeychain.sh "$DEPS" "$QT"

      - name: Configure
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/vcpkg_installed/x64-windows/lib/pkgconfig
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT;$DEPS;$VCPKG_INSTALLED/x64-windows"
          -DPKG_CONFIG_EXECUTABLE="$VCPKG_INSTALLED/x64-windows/tools/pkgconf/pkgconf.exe"
          -DBUILD_TESTING=OFF
          -DCIRRUS_BUILD_GALLERY=OFF
          -DCIRRUS_EXECUTABLE=Cirrus
          -DCIRRUS_DEPLOY_QT=ON
          -DCMAKE_INSTALL_BINDIR=.
          -DCIRRUS_RUNTIME_DIRS="$DEPS/bin;$VCPKG_INSTALLED/x64-windows/bin"

      # -k 0: report every compile error of a run, not only the first few.
      - name: Build
        run: cmake --build build --parallel 4 -- -k 0

      - name: Install tree
        if: inputs.package
        # windeployqt resolves every DLL Cirrus.exe needs: FFmpeg, OpenSSL and zlib through
        # PATH (Git Bash's PATH uses /d/... paths; D:/... would split at the colon). It takes
        # any qt6*.dll for a Qt module and looks for it only in Qt's bin directory, so
        # QtKeychain's qt6keychain.dll is copied there (the runner's Qt is a throwaway copy).
        run: |
          export PATH="$(cygpath -u "$DEPS")/bin:$(cygpath -u "$VCPKG_INSTALLED")/x64-windows/bin:$PATH"
          cp "$DEPS/bin/qt6keychain.dll" "$QT/bin/"
          cmake --install build --prefix "$STAGE"
          ls "$STAGE"
          mkdir -p dist
          7z a -tzip "dist/Cirrus-$VERSION-windows-x64.zip" "$STAGE" > /dev/null

      - name: Installer
        if: inputs.package
        shell: pwsh
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          "/DAppVersion=$env:VERSION"
          "/DStageDir=$env:STAGE"
          "/DOutputDir=$PWD\dist"
          packaging\windows\cirrus.iss

      - uses: actions/upload-artifact@v7
        if: inputs.package
        with:
          name: windows
          path: dist/*
          if-no-files-found: error
