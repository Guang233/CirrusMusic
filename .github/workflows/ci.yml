# Builds and tests every push to master and every pull request (docs/tasks/release.md §7).
# Linux always; Windows only when asked (Run workflow, or the release workflow), since its
# runner minutes count double on a private repository.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      windows:
        description: Also build on Windows
        type: boolean
        default: false
  workflow_call:
    inputs:
      windows:
        type: boolean
        default: false

# A newer push replaces a running check of the same branch. (Called from the release
# workflow, github.workflow is "Release", so a release never cancels a branch's CI.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: 6.11.2
  QT_MODULES: qtmultimedia qtshadertools qtimageformats

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-22.04
    env:
      DEPS: ${{ github.workspace }}/../deps
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: packaging/linux/install-build-deps.sh

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Cache FFmpeg and QtKeychain
        id: deps
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPS }}
          key: deps-linux-ubuntu22.04-${{ hashFiles('packaging/deps/*.sh') }}

      - name: Build FFmpeg and QtKeychain
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          packaging/deps/build-ffmpeg.sh "$DEPS"
          packaging/deps/build-qtkeychain.sh "$DEPS" "$QT_ROOT_DIR"

      - name: Configure
        run: >
          PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$DEPS"

      - name: Build (app, gallery, tests)
        run: cmake --build build --parallel 4

      - name: QML lint
        run: cmake --build build --target all_qmllint

      # Known failures, excluded until fixed (AGENTS.md "Build and verify"):
      # backend_runtime (closeWhileDatabaseOpening), playback_observation,
      # playback_observation_feed, linux_observation_service.
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          dbus-run-session --
          ctest --test-dir build --output-on-failure --no-tests=error --parallel 4
          -E "^(backend_runtime|playback_observation|playback_observation_feed|linux_observation_service)$"

  windows:
    name: Windows build
    if: inputs.windows
    uses: ./.github/workflows/windows.yml
