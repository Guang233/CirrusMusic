# macOS, called by CI (build and tests, when asked) and the release workflow (the dmg).
# packaging/README.md. Apple Silicon runner, Qt from the Qt installer, FFmpeg and QtKeychain
# from packaging/deps/, OpenSSL and zstd from Homebrew. The package runs on macOS 15 and
# later: Homebrew's libraries are built for the runner's macOS.
name: macOS

on:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false

permissions:
  contents: read

env:
  QT_VERSION: 6.11.2
  QT_MODULES: qtmultimedia qtshadertools qtimageformats
  # The oldest macOS the build runs on: Homebrew's bottles on macos-15 need 15.
  MACOSX_DEPLOYMENT_TARGET: "15.0"

jobs:
  macos:
    name: ${{ inputs.package && 'macOS package' || 'macOS build and tests' }}
    runs-on: macos-15
    env:
      DEPS: ${{ github.workspace }}/../deps
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: ${{ env.QT_MODULES }}
          cache: true
          # Same aqtinstall as windows.yml: the 3.3.0 release cannot find Qt 6.11's repository
          # layout on Windows; use the fixed master here too until a release ships.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7

      # coreutils: sha256sum for packaging/deps/versions.sh.
      - name: Homebrew packages
        run: brew install --quiet ninja pkgconf coreutils openssl@3 zstd

      # FFmpeg as the Linux packages build it (LGPL, MP3 and FLAC), and QtKeychain against
      # the bundled Qt; the tests use the same FFmpeg as the package.
      - name: Cache FFmpeg and QtKeychain
        id: deps
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPS }}
          key: deps-macos${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ env.QT_VERSION }}-${{ hashFiles('packaging/deps/*.sh') }}

      - name: FFmpeg and QtKeychain
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          packaging/deps/build-ffmpeg.sh "$DEPS"
          packaging/deps/build-qtkeychain.sh "$DEPS" "$QT_ROOT_DIR"

      - name: Configure
        if: ${{ !inputs.package }}
        run: |
          brew=$(brew --prefix)
          PKG_CONFIG_PATH="$DEPS/lib/pkgconfig" cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$DEPS;$brew/opt/openssl@3;$brew/opt/zstd" \
            -DOPENSSL_ROOT_DIR="$brew/opt/openssl@3"

      # -k 0: report every compile error of a run, not only the first few.
      - name: Build (app, gallery, tests)
        if: ${{ !inputs.package }}
        run: cmake --build build --parallel 4 -- -k 0

      - name: QML lint
        if: ${{ !inputs.package }}
        run: cmake --build build --target all_qmllint

      - name: Tests
        if: ${{ !inputs.package }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          ctest --test-dir build --output-on-failure --no-tests=error --parallel 4

      - name: dmg
        if: inputs.package
        run: JOBS=4 packaging/macos/build-package.sh "$QT_ROOT_DIR" "$DEPS" dist

      - uses: actions/upload-artifact@v7
        if: inputs.package
        with:
          name: macos
          path: dist/*
          if-no-files-found: error
